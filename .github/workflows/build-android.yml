name: Android

# 本机没有 Android SDK（见 docs/android-port-plan.md §0），APK 只能由 CI 产出。
# 这一条工作流从阶段 1 起就持续编译 Android 工程，避免把编译问题拖到阶段 6。
#
# ⚠️ 需要推送一次才能在 CI 上真正验证：本工作流只落地了文件，未推送、未运行。
#
# 运行器选 windows-latest 是为了与仓库现有两条工作流（build-test.yml / release.yml）
# 保持一致；同时它也是 `npm ci` 已被验证过的平台（本仓库的 postinstall 在 Linux 上
# 会走 build-config/deps.js 的 replaceSqliteLib 分支，那条路从未被验证过）。

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # 面向 Web/Capacitor 的渲染层构建，产出 dist-web/（Electron 的 dist/ 与它无关）。
      # capacitor.config.ts 的 webDir 指向 dist-web，必须先有产物再 sync。
      - name: Build web renderer bundle
        run: npm run build:web

      # 产物级守卫（2026-10-16）：web 产物里**不能**出现 electron-log 的 Node 构建。
      #
      # 渲染层写的是 `import log from 'electron-log/node'`（桌面主进程要那份：File 传输 +
      # `APPDATA` 推目录）；web 构建用 `webpack.config.web.js` 的「关键差异 4.11」把它换成
      # `@common/platform/log/web`。替换一旦失效，`electron-log/src/node/NodeExternalApi.js`
      # 会带着 `AppData/Roaming` / `Library/Logs` / `xdg-open` 进产物 ⇒ 真机上**日志静默消失**
      # （写盘抛错被 electron-log 自己的 errorHandler 吞掉）—— 而真机验收正要靠 logcat 看
      # 应用自己的日志（`docs/android/acceptance.md`）。
      #
      # "Node 专有模块混进 web 产物"在本项目已出现过两次（整个 `electron` 包、以及这次的
      # `electron-log`），两次都**本机测不到、只有产物层面才看得见**。所以守卫就放在
      # **产出这个包的地方**：它失败 = 这个 APK 不该发。
      # 这三个字面量来自 NodeExternalApi，**只在 Node 构建里存在**（renderer 构建没有它们）。
      - name: Guard the web bundle against the Node logger build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $markers = @('AppData/Roaming', 'Library/Logs', 'xdg-open')
          if (-not (Test-Path -Path dist-web)) {
            Write-Host "::error title=web bundle::dist-web is missing - build:web did not produce the expected directory"
            exit 1
          }
          # -List：每个文件只报第一条命中，避免同一份 chunk 刷屏。
          $hits = @(Get-ChildItem -Path dist-web -Recurse -Filter *.js |
            Select-String -Pattern $markers -List)

          if ($hits.Count -gt 0) {
            $i = 0
            foreach ($hit in $hits) {
              if ($i -ge 10) { break }   # GitHub 每个 step 只展示 10 条 error annotation
              Write-Host "::error title=web bundle has the Node logger build::$($hit.Path) matched '$($hit.Pattern)'"
              $i++
            }
            Write-Host "dist-web file count: $(@(Get-ChildItem -Path dist-web -Recurse -Filter *.js).Count)"
            exit 1
          }
          Write-Host "dist-web has none of: $($markers -join ', ')"

      # 正面守卫（2026-10-16）：首版里**两个**关键功能都跑在独立 worker chunk 里 ——
      #   · 自定义源：`platform/userApi/web.js:19` 的 `new Worker(new URL('./worker.js', import.meta.url))`
      #     ⇒ webpack 拆出的 chunk（本机实测：`112.*.js`，也是全部产物里唯一带 `use lx.request` 的）；
      #   · 下载 / 数据 / 歌词走的主渲染 worker：`platform/workers/web.ts`，产物里是
      #     `new Worker(new URL(n.p+n.u(835), n.b))`（本机实测：`835.*.js`，外面是 Comlink 包装）。
      # 两者都在运行期按 chunk id 拼 URL，所以"chunk 到底有没有被产出来"**只有产物层面看得见**：
      # 拆包一旦失效（那行 URL 被改、或 webpack 配置被动），本机 lint / tsc / 单测**全都不会红**，
      # 真机上的表现是"导入自定义源没反应" / "下载不动"。
      #
      # 两道检查：① 自定义源 worker 的运行时必须在（用 `use lx.request` 这个唯一标志串）；
      # ② bundle 里每一处 `new Worker(...)` 引用的 chunk id 都必须真的落成文件。
      # ③ 升降调的音频 worklet（**带名字**的 chunk，上面那条规则盖不到）必须被产出来。
      - name: Guard the web bundle against a missing or unloadable worker / worklet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not (Test-Path -Path dist-web)) {
            Write-Host "::error title=web bundle::dist-web is missing - build:web did not run"
            exit 1
          }

          $marker = @(Get-ChildItem -Path dist-web -Recurse -Filter *.js |
            Select-String -Pattern 'use lx.request' -List)
          if ($marker.Count -eq 0) {
            Write-Host "::error title=custom-source worker::no chunk carries the worker-runtime marker 'use lx.request' - the custom-source worker was not emitted, so importing a source would silently do nothing on device"
            exit 1
          }
          foreach ($hit in $marker) { Write-Host "custom-source worker chunk: $(Split-Path -Leaf $hit.Path)" }

          $missing = @()
          $referenced = 0
          foreach ($file in @(Get-ChildItem -Path dist-web -Recurse -Filter *.js)) {
            $text = Get-Content -LiteralPath $file.FullName -Raw
            foreach ($m in [regex]::Matches($text, 'new Worker\(')) {
              $window = $text.Substring($m.Index, [Math]::Min(240, $text.Length - $m.Index))
              $id = [regex]::Match($window, '\.u\((\d+)\)')
              if (-not $id.Success) { $missing += "$($file.Name): unparsable worker reference"; continue }
              $referenced++
              $chunk = $id.Groups[1].Value
              if (@(Get-ChildItem -Path dist-web -Filter "$chunk.*.js").Count -eq 0) {
                $missing += "$($file.Name) -> chunk $chunk"
              }
            }
          }
          Write-Host "worker constructions found in the bundle: $referenced"
          if ($missing.Count -gt 0) {
            Write-Host "::error title=worker chunk::$($missing -join ' | ') - the bundle constructs a Worker whose chunk was not emitted, so that feature cannot start on device"
            exit 1
          }
          Write-Host 'every referenced worker chunk exists'

          # ③ 音频 worklet（升降调）：`plugins/player/index.ts` 用
          #    `audioWorklet.addModule(new URL('./pitch-shifter/phase-vocoder.js', import.meta.url))`
          #    加载它，webpack 依据 `webpackChunkName: 'pitch_shifter.audioWorklet'` 产出一个**带名字**的
          #    chunk（实测 `pitch_shifter.audioWorklet.82d985e2.js`）—— 名字不是数字，所以上面那条
          #    "chunk id → <id>.*.js" 的规则**盖不到它**，必须单独查。
          #    参考：渲染层 2026-10-16 给那次 `addModule` 补了 `.catch`（失败会报出来并允许重试），
          #    但**产物层面**仍然要有人盯着"它到底有没有被产出来"。
          $worklet = @(Get-ChildItem -Path dist-web -Recurse -Filter '*audioWorklet*.js')
          if ($worklet.Count -eq 0) {
            Write-Host "::error title=audio worklet::no *audioWorklet*.js asset in dist-web - the pitch shifter worklet was not emitted, so that control would silently do nothing on device"
            exit 1
          }
          $workletReference = @(Get-ChildItem -Path dist-web -Recurse -Filter *.js |
            Select-String -Pattern 'audioWorklet\.addModule' -List)
          if ($workletReference.Count -eq 0) {
            Write-Host "::error title=audio worklet::the bundle has no audioWorklet.addModule(...) reference, but worklet assets were emitted - the loader was dropped or rewritten"
            exit 1
          }
          Write-Host "audio worklet assets: $($worklet.Name -join ', ') (referenced from: $((@($workletReference) | ForEach-Object { Split-Path -Leaf $_.Path }) -join ', '))"

      # 真产物冒烟（2026-10-16）：在真实 Chromium 里**直接跑这个 web 产物**（`dist-web/index.html`）。
      # 那个页面里既没有 Electron 的 `process.versions.electron`、也没有原生桥，所以
      # `renderer/platform/index.ts` 判定 `shell='unknown'` ⇒ 走的正是 Android WebView 那条**移动分支**。
      # 它钉的是**验收项本身**（真产物里没有 macOS 交通灯、移动分支渲染出来），而不是组件替身：
      # 变异验证过 —— 把产物伪装成桌面壳（注入 `window.process.versions.electron`）会让它精确变红。
      # 放在这里（`build:web` 之后、gradle 之前）：产物已就绪，失败也不用等 6 分钟的编译。
      - name: Smoke-test the built web bundle in the mobile branch
        run: npm run test:web-bundle-smoke

      # 生成 android/app/capacitor.build.gradle、android/capacitor.settings.gradle
      # 并把 dist-web 复制到 android/app/src/main/assets/public。
      # 缺少这一步时 gradlew 会在配置阶段直接失败（settings.gradle 会 apply 一个不存在的文件）。
      - name: Sync Capacitor android project
        run: npx cap sync android

      # 承接上一步：**本轮 dist-web 的每一个文件**都必须出现在同步后的 Android assets 里。
      #
      # 为什么不是"只查那个 worker chunk"：`cap sync` **不清理**目标目录（本机实测：同步目录里
      # 23 个 js，而 dist-web 只有 21 个，且**逐个文件名都不是本轮的**）—— 旧残留会让任何
      # "存在性检查"**假绿**。改用**本轮的文件清单**逐个比对：既覆盖两个 worker chunk，
      # 也覆盖以后可能新增的运行期资源（音频 worklet、`media/`、`static/`），而且天然不吃残留。
      - name: Guard the synced Android assets against a stale web bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $assets = 'android/app/src/main/assets/public'
          if (-not (Test-Path -Path $assets)) {
            Write-Host "::error title=synced assets::$assets is missing - cap sync did not copy the web bundle"
            exit 1
          }
          $root = (Resolve-Path dist-web).Path
          $missing = @()
          $total = 0
          foreach ($file in @(Get-ChildItem -Path dist-web -Recurse -File)) {
            $total++
            $relative = $file.FullName.Substring($root.Length + 1)
            if (-not (Test-Path -LiteralPath (Join-Path $assets $relative))) { $missing += $relative }
          }
          Write-Host "dist-web files checked: $total"
          if ($missing.Count -gt 0) {
            $shown = @($missing | Select-Object -First 10)
            Write-Host "::error title=synced assets are stale::$($missing.Count) of $total file(s) missing from $assets, e.g. $($shown -join ', ') - cap sync did not copy the current web bundle"
            exit 1
          }
          Write-Host "all $total dist-web files are present in the synced assets"

      # Capacitor 8 的 Android 工具链：android/build.gradle 锁 AGP 8.13.0，
      # gradle-wrapper.properties 锁 Gradle 8.14.3，variables.gradle 是 compileSdk/targetSdk 36。
      # AGP 8.13 要求 JDK 17+，Capacitor 8 的官方要求是 JDK 21；Gradle 8.14.3 支持 17–24。
      # 本机装的是 JDK 20（非 LTS，AGP 8.13 未正式支持），所以 CI 明确锁 21。
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 只显式装 platform-tools 与 compileSdk 对应的 platform；
      # build-tools 交给 AGP 按它自己的默认版本自动下载（该动作默认已接受 SDK 许可）。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'

      # 编译失败时日志需要 token 才能读，所以这里把编译错误本身变成
      # `::error title=gradle::...` workflow command（check annotation，免 token 可读）：
      #   1) `2>&1 | Tee-Object` 原样保留日志输出，同时留一份文件给 artifact；
      #   2) $LASTEXITCODE 不受其后的 cmdlet 影响，因此仍是 gradlew 的真实退出码；
      #   3) 只挑含 error: / e: / FAILURE: / What went wrong 的行，
      #      每行截断到 300 字符，最多 30 行写进 step summary；
      #      逐行 annotation 最多 10 条（见下面的 $maxAnnotations，GitHub 每个 step
      #      只展示 10 条 error annotation，多发会被静默丢弃）；
      #   4) 全量日志由后面 `if: always()` 的 upload-artifact 步骤留档。
      - name: Build debug APK
        id: gradle_assemble_debug
        working-directory: android
        shell: pwsh
        run: |
          # runner 的 pwsh 包装脚本会设 $ErrorActionPreference='stop'：gradle 往 stderr
          # 写一行就可能被当成终止错误，提前打断 Tee 并丢掉后续编译错误。这里显式放回
          # 'Continue'，真正的成败只看 $LASTEXITCODE。
          $ErrorActionPreference = 'Continue'

          $dir = Join-Path $env:GITHUB_WORKSPACE '.design/android'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $log = Join-Path $dir 'gradle-assembleDebug.log'

          .\gradlew.bat assembleDebug --no-daemon --stacktrace 2>&1 | Tee-Object -FilePath $log
          # $LASTEXITCODE 由原生命令设置，后面的 cmdlet（Tee-Object）不会重置它。
          $code = $LASTEXITCODE
          # 不把退出码追加进日志文件：Tee-Object 与 Out-File 的默认编码不同，混写会让
          # 文件尾部变成乱码（本机 5.1 实测：Tee 写 UTF-16LE，Out-File -Encoding UTF8
          # 追加 UTF-8）。退出码已经落在 step summary、annotation 和 job 日志里。
          Write-Host "exit code: $code"

          # 只保留最相关的诊断行：javac 的 "error:"、Kotlin 的 "e: "、Gradle 的
          # "FAILURE:" / "What went wrong"。(-match 默认大小写不敏感。)
          $hits = @(Get-Content -Path $log -ErrorAction SilentlyContinue |
            Where-Object { $_ -match 'error:|\be: |FAILURE:|What went wrong' } |
            Select-Object -Unique)
          $maxSummaryLines = 30
          $clean = @()
          foreach ($h in ($hits | Select-Object -First $maxSummaryLines)) {
            $t = ($h -replace '[\r\n]+', ' ').Trim()
            # 剥掉 PowerShell 包裹原生命令 stderr 的前缀（"gradlew.bat : FAILURE: ..."）。
            $t = ($t -replace '^\s*\S+\.(exe|cmd|bat|ps1)\s*:\s*', '').Trim()
            if ($t.Length -gt 300) { $t = $t.Substring(0, 300) + '...' }
            if ($t.Length -gt 0) { $clean += $t }
          }

          $block = @('### gradle assembleDebug', '', '```', "exit code: $code")
          $block += "matched diagnostics: $($hits.Count) (showing first $maxSummaryLines)"
          if ($clean.Count -eq 0) { $block += '(no error: / e: / FAILURE: / What went wrong line found)' }
          $block += $clean
          $block += @('```', '',
            "full log: .design/android/gradle-assembleDebug.log (uploaded as artifact rain-music-android-gradle-output)")
          $block | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8

          if ($code -ne 0) {
            # GitHub 每个 step 最多展示 10 条 error annotation：超出部分会被丢弃。
            # 所以逐行最多发 10 条；超过时留 1 条给“还有 N 行”的提示，正文限制在
            # 300 字符以内，绝不把整份日志塞进 annotation。
            $maxAnnotations = 10
            $lines = $clean
            $overflow = 0
            if ($lines.Count -gt $maxAnnotations) {
              $overflow = $lines.Count - $maxAnnotations + 1
              $lines = @($lines | Select-Object -First ($maxAnnotations - 1))
            }
            if ($lines.Count -eq 0) {
              Write-Host "::error title=gradle::assembleDebug failed with exit code $code and no matching diagnostic line"
            }
            foreach ($l in $lines) { Write-Host "::error title=gradle::$l" }
            if ($overflow -gt 0) {
              Write-Host "::error title=gradle::$overflow more matching line(s) omitted; see the step summary and the rain-music-android-gradle-output artifact"
            }
            exit $code
          }
          Write-Host 'assembleDebug passed'

      - uses: actions/upload-artifact@v4
        with:
          name: rain-music-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 全量 gradle 输出留档：即使编译失败也要上传（上面那个既有 artifact 只收 APK，
      # 且没有 if: always()，失败时会被跳过），所以这里单独加一个 always() 的上传。
      - name: Upload gradle output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rain-music-android-gradle-output
          path: .design/android/*.log
          if-no-files-found: warn
