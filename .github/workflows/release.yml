name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Check version tag
        run: |
          $expected = 'v' + (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Version tag does not match package.json" }
      - run: npm ci
      - run: npm run verify
      - run: npm run test:ui
      - name: Package Windows x64
        run: node build-config/build-pack.js target=dir
        env:
          RAIN_ELECTRON_DIST: node_modules/electron/dist
      - name: Verify packaged application
        run: npm run test:package
      - name: Zip and checksum
        run: |
          $archive = 'Rain-Music-' + $env:GITHUB_REF_NAME + '-windows-x64.zip'
          Compress-Archive -Path build/win-unpacked/* -DestinationPath "build/$archive"
          $hash = (Get-FileHash "build/$archive" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Set-Content build/SHA256SUMS.txt -Encoding utf8
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = 'build/Rain-Music-' + $env:GITHUB_REF_NAME + '-windows-x64.zip'
          gh release create $env:GITHUB_REF_NAME $archive build/SHA256SUMS.txt --verify-tag --title "Rain Music $env:GITHUB_REF_NAME" --notes-file CHANGELOG.md
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-verification-results
          path: .design/**/results.json
          include-hidden-files: true
