name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # ── `npm run verify` 的逐步拆解 ─────────────────────────────────────
      # package.json:53 → "verify": "npm run typecheck && npm run test:unit && npm run build"
      # 原来是一整步 `npm run verify`：CI 只回一个退出码，无法知道是 lint/类型/单测/
      # 打包里的哪一件事红的（本机三门全绿，所以必须让 CI 自己指名道姓）。
      # 每一步：唯一 id + continue-on-error（只用于收集信息，不让后面的步骤被跳过），
      # 把输出尾部 60 行写进 $GITHUB_STEP_SUMMARY 和 .design/verify/<step>.log，
      # 失败时发一条 `::error` workflow command —— 它会成为 check annotation，
      # 不需要 token 就能读。
      # 该失败的最终仍然失败：末尾的 "Verify matrix" 在任一 outcome != success 时 exit 1。
      #
      # ⚠️ step id 只允许下划线：GitHub 表达式不支持连字符属性访问，
      #    steps.verify-typecheck.outcome 会被解析成减法、值变空，
      #    聚合步骤就会无论成败都失败。
      - id: verify_typecheck
        name: Verify / typecheck
        continue-on-error: true
        shell: pwsh
        run: |
          # runner 的 pwsh 包装脚本会设 $ErrorActionPreference='stop'：原生命令只要往
          # stderr 写一行（npm 就会）就可能被当成终止错误，提前打断 Tee。这里显式放回
          # 'Continue'，成败一律以退出码为准。
          $ErrorActionPreference = 'Continue'

          $dir = '.design/verify'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $log = "$dir/typecheck.log"
          $title = 'Verify / typecheck'

          npm run typecheck 2>&1 | Tee-Object -FilePath $log
          # $LASTEXITCODE 由原生命令设置，其后的 cmdlet（Tee-Object）不会重置它，
          # 所以这里拿到的仍是 npm 的真实退出码。
          $code = $LASTEXITCODE
          # 不把退出码追加进日志文件：Tee-Object 与 Out-File 的默认编码不同，混写会让
          # 文件尾部变成乱码（本机 5.1 实测：Tee 写 UTF-16LE，Out-File -Encoding UTF8
          # 追加 UTF-8）。退出码已经落在 step summary、annotation 和 job 日志里。
          Write-Host "exit code: $code"

          $tail = @(Get-Content -Path $log -Tail 60 -ErrorAction SilentlyContinue)
          $block = @("### $title", '', '```', "exit code: $code")
          $block += $tail
          $block += @('```', '')
          $block | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8

          Write-Host "----- $title : last 60 lines -----"
          $tail | ForEach-Object { Write-Host $_ }

          if ($code -ne 0) {
            # 先从尾部剔除 PowerShell 把原生命令 stderr 包成 ErrorRecord 的噪音
            # （CategoryInfo / FullyQualifiedErrorId / NativeCommandError / "+ ..." /
            #  "At line:..." / 栈帧），否则它们会抢在真正的诊断前面被当成“首行错误”。
            $diag = @($tail | Where-Object {
              ($_ -match '\S') -and
              ($_ -notmatch 'CategoryInfo|FullyQualifiedErrorId|NativeCommandError|^\s*\+|^\s*At line:|^\s*at ')
            })
            # 再剥掉 PowerShell 包裹原生命令 stderr 的前缀（"npm.ps1 : 真正内容"），
            # 并丢掉 npm 自己的收尾噪音（"npm error code 2" / "npm error command failed"），
            # 否则 annotation 里只会出现这两类东西，看不到真正的诊断。
            $norm = @($diag | ForEach-Object {
              ($_ -replace '^\s*\S+\.(exe|cmd|bat|ps1)\s*:\s*', '').Trim()
            } | Where-Object { ($_ -match '\S') -and ($_ -notmatch '^npm (error|warn)\b') } | Select-Object -Unique)
            # 依次尝试：结构化诊断 → 宽松关键字 → 清理后的第一行 → 原始第一行。
            $first = $norm | Where-Object { $_ -match 'error TS\d+|error:|\berror\b|not ok \d+|# fail|AssertionError|Cannot find module|SyntaxError|TypeError' } | Select-Object -First 1
            if (-not $first) { $first = $norm | Where-Object { $_ -match 'fail|problem|exception' } | Select-Object -First 1 }
            if (-not $first) { $first = $norm | Select-Object -First 1 }
            if (-not $first) { $first = $diag | Select-Object -First 1 }
            if (-not $first) { $first = '(no output)' }
            $first = ($first -replace '[\r\n]+', ' ').Trim()
            if ($first.Length -gt 300) { $first = $first.Substring(0, 300) + '...' }
            Write-Host "::error title=$title::exit $code :: $first"
            exit $code
          }
          Write-Host "$title passed"

      - id: verify_unit
        name: Verify / test:unit
        continue-on-error: true
        shell: pwsh
        run: |
          # 同 typecheck：避免 runner 包装脚本的 'stop' 让原生 stderr 提前中断 Tee。
          $ErrorActionPreference = 'Continue'

          $dir = '.design/verify'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $log = "$dir/unit.log"
          $title = 'Verify / test:unit'

          npm run test:unit 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          # 不把退出码追加进日志文件：Tee-Object 与 Out-File 的默认编码不同，混写会让
          # 文件尾部变成乱码（本机 5.1 实测：Tee 写 UTF-16LE，Out-File -Encoding UTF8
          # 追加 UTF-8）。退出码已经落在 step summary、annotation 和 job 日志里。
          Write-Host "exit code: $code"

          $tail = @(Get-Content -Path $log -Tail 60 -ErrorAction SilentlyContinue)
          $block = @("### $title", '', '```', "exit code: $code")
          $block += $tail
          $block += @('```', '')
          $block | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8

          Write-Host "----- $title : last 60 lines -----"
          $tail | ForEach-Object { Write-Host $_ }

          if ($code -ne 0) {
            # 先从尾部剔除 PowerShell 把原生命令 stderr 包成 ErrorRecord 的噪音
            # （CategoryInfo / FullyQualifiedErrorId / NativeCommandError / "+ ..." /
            #  "At line:..." / 栈帧），否则它们会抢在真正的诊断前面被当成“首行错误”。
            $diag = @($tail | Where-Object {
              ($_ -match '\S') -and
              ($_ -notmatch 'CategoryInfo|FullyQualifiedErrorId|NativeCommandError|^\s*\+|^\s*At line:|^\s*at ')
            })
            # 再剥掉 PowerShell 包裹原生命令 stderr 的前缀（"npm.ps1 : 真正内容"），
            # 并丢掉 npm 自己的收尾噪音（"npm error code 2" / "npm error command failed"），
            # 否则 annotation 里只会出现这两类东西，看不到真正的诊断。
            $norm = @($diag | ForEach-Object {
              ($_ -replace '^\s*\S+\.(exe|cmd|bat|ps1)\s*:\s*', '').Trim()
            } | Where-Object { ($_ -match '\S') -and ($_ -notmatch '^npm (error|warn)\b') } | Select-Object -Unique)
            # 依次尝试：结构化诊断（node --test 形如 "# fail 3" / "not ok 12 - name"、
            # tsc 的 "error TS2322"、node 的 "Cannot find module"）→ 宽松关键字 →
            # 清理后的第一行 → 原始第一行（保底，宁可难看也别空手）。
            $first = $norm | Where-Object { $_ -match 'error TS\d+|error:|\berror\b|not ok \d+|# fail|AssertionError|Cannot find module|SyntaxError|TypeError' } | Select-Object -First 1
            if (-not $first) { $first = $norm | Where-Object { $_ -match 'fail|problem|exception' } | Select-Object -First 1 }
            if (-not $first) { $first = $norm | Select-Object -First 1 }
            if (-not $first) { $first = $diag | Select-Object -First 1 }
            if (-not $first) { $first = '(no output)' }
            $first = ($first -replace '[\r\n]+', ' ').Trim()
            if ($first.Length -gt 300) { $first = $first.Substring(0, 300) + '...' }
            Write-Host "::error title=$title::exit $code :: $first"
            exit $code
          }
          Write-Host "$title passed"

      - id: verify_build
        name: Verify / build
        continue-on-error: true
        shell: pwsh
        run: |
          # 同 typecheck：避免 runner 包装脚本的 'stop' 让原生 stderr 提前中断 Tee。
          $ErrorActionPreference = 'Continue'

          $dir = '.design/verify'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $log = "$dir/build.log"
          $title = 'Verify / build'

          npm run build 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          # 不把退出码追加进日志文件：Tee-Object 与 Out-File 的默认编码不同，混写会让
          # 文件尾部变成乱码（本机 5.1 实测：Tee 写 UTF-16LE，Out-File -Encoding UTF8
          # 追加 UTF-8）。退出码已经落在 step summary、annotation 和 job 日志里。
          Write-Host "exit code: $code"

          $tail = @(Get-Content -Path $log -Tail 60 -ErrorAction SilentlyContinue)
          $block = @("### $title", '', '```', "exit code: $code")
          $block += $tail
          $block += @('```', '')
          $block | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8

          Write-Host "----- $title : last 60 lines -----"
          $tail | ForEach-Object { Write-Host $_ }

          if ($code -ne 0) {
            # 先从尾部剔除 PowerShell 把原生命令 stderr 包成 ErrorRecord 的噪音
            # （CategoryInfo / FullyQualifiedErrorId / NativeCommandError / "+ ..." /
            #  "At line:..." / 栈帧），否则它们会抢在真正的诊断前面被当成“首行错误”。
            $diag = @($tail | Where-Object {
              ($_ -match '\S') -and
              ($_ -notmatch 'CategoryInfo|FullyQualifiedErrorId|NativeCommandError|^\s*\+|^\s*At line:|^\s*at ')
            })
            # 再剥掉 PowerShell 包裹原生命令 stderr 的前缀（"npm.ps1 : 真正内容"），
            # 并丢掉 npm 自己的收尾噪音（"npm error code 2" / "npm error command failed"），
            # 否则 annotation 里只会出现这两类东西，看不到真正的诊断。
            $norm = @($diag | ForEach-Object {
              ($_ -replace '^\s*\S+\.(exe|cmd|bat|ps1)\s*:\s*', '').Trim()
            } | Where-Object { ($_ -match '\S') -and ($_ -notmatch '^npm (error|warn)\b') } | Select-Object -Unique)
            # 依次尝试：结构化诊断 → 宽松关键字 → 清理后的第一行 → 原始第一行。
            $first = $norm | Where-Object { $_ -match 'error TS\d+|error:|\berror\b|not ok \d+|# fail|AssertionError|Cannot find module|SyntaxError|TypeError' } | Select-Object -First 1
            if (-not $first) { $first = $norm | Where-Object { $_ -match 'fail|problem|exception' } | Select-Object -First 1 }
            if (-not $first) { $first = $norm | Select-Object -First 1 }
            if (-not $first) { $first = $diag | Select-Object -First 1 }
            if (-not $first) { $first = '(no output)' }
            $first = ($first -replace '[\r\n]+', ' ').Trim()
            if ($first.Length -gt 300) { $first = $first.Substring(0, 300) + '...' }
            Write-Host "::error title=$title::exit $code :: $first"
            exit $code
          }
          Write-Host "$title passed"

      # UI suites run as separate steps so a failure names the culprit.
      # continue-on-error keeps the rest running and builds a full matrix.
      - id: ui_settings_controls
        name: UI / settings controls
        continue-on-error: true
        run: npm run test:settings-controls
      - id: ui_settings_layout
        name: UI / settings layout
        continue-on-error: true
        run: npm run test:settings-layout
      - id: ui_player
        name: UI / player
        continue-on-error: true
        run: npm run test:player
      - id: ui_compact_lyrics
        name: UI / compact lyrics
        continue-on-error: true
        run: npm run test:compact-lyrics
      - id: ui_lyric_security
        name: UI / lyric security
        continue-on-error: true
        run: npm run test:lyric-security
      - id: ui_responsive_layout
        name: UI / responsive layout
        continue-on-error: true
        run: npm run test:responsive-layout
      # 交通灯是验收项「Android 上不出现 macOS 交通灯」的两半证据：`window-controls` 跑真实组件
      # （桌面端三颗按钮的行为与无障碍标签），`window-controls-shell` 跑判定分支渲染出的 DOM
      # （移动端零颗按钮且不挂载组件、桌面端照旧挂载）。两者此前都只在本机跑，CI 从不执行。
      - id: ui_window_controls
        name: UI / window controls
        continue-on-error: true
        run: npm run test:window-controls
      - id: ui_window_controls_shell
        name: UI / window controls shell
        continue-on-error: true
        run: npm run test:window-controls-shell

      - name: UI matrix
        if: always()
        shell: pwsh
        run: |
          $rows = [ordered]@{
            'settings-controls'     = '${{ steps.ui_settings_controls.outcome }}'
            'settings-layout'       = '${{ steps.ui_settings_layout.outcome }}'
            'player'                = '${{ steps.ui_player.outcome }}'
            'compact-lyrics'        = '${{ steps.ui_compact_lyrics.outcome }}'
            'lyric-security'        = '${{ steps.ui_lyric_security.outcome }}'
            'responsive-layout'     = '${{ steps.ui_responsive_layout.outcome }}'
            'window-controls'       = '${{ steps.ui_window_controls.outcome }}'
            'window-controls-shell' = '${{ steps.ui_window_controls_shell.outcome }}'
          }
          New-Item -ItemType Directory -Force -Path .design | Out-Null
          $lines = $rows.GetEnumerator() | ForEach-Object { "{0,-22} {1}" -f $_.Key, $_.Value }
          $lines | ForEach-Object { Write-Host $_ }
          $lines | Set-Content -Path .design/ui-matrix.txt -Encoding UTF8
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            .design/**/results.json
            .design/ui-matrix.txt
            .design/**/*.log
          include-hidden-files: true

      - name: fail if any UI suite failed
        if: always()
        shell: pwsh
        run: |
          # steps.<id>.outcome is the result BEFORE continue-on-error is applied,
          # so it is the real signal (conclusion is masked to 'success').
          $rows = [ordered]@{
            'settings-controls'     = '${{ steps.ui_settings_controls.outcome }}'
            'settings-layout'       = '${{ steps.ui_settings_layout.outcome }}'
            'player'                = '${{ steps.ui_player.outcome }}'
            'compact-lyrics'        = '${{ steps.ui_compact_lyrics.outcome }}'
            'lyric-security'        = '${{ steps.ui_lyric_security.outcome }}'
            'responsive-layout'     = '${{ steps.ui_responsive_layout.outcome }}'
            'window-controls'       = '${{ steps.ui_window_controls.outcome }}'
            'window-controls-shell' = '${{ steps.ui_window_controls_shell.outcome }}'
          }
          $bad = @($rows.GetEnumerator() | Where-Object { $_.Value -ne 'success' } | ForEach-Object { $_.Key })
          $all = ($rows.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ' '
          Write-Host "result: $all"
          # Emit workflow commands so the matrix also lands in check annotations, which are
          # readable without a token. 全绿时必须发 ::notice 而不是 ::error —— 否则一次**成功**
          # 的运行也会在 check 页上顶着 "2 errors" 的注解（与 responsive-layout.electron.cjs:64
          # 既有的 level 选择保持一致：只有失败才用 ::error）。
          $level = if ($bad.Count -gt 0) { 'error' } else { 'notice' }
          Write-Host "::$level title=UI matrix::$all"
          if ($bad.Count -gt 0) {
            Write-Host "::error title=Failing UI suites::$($bad -join ', ')"
            exit 1
          }
          Write-Host 'all UI suites passed'

      # 放在最后 + if: always()：这样即使 verify 的三个步骤有失败（它们带
      # continue-on-error，不会中断 job），UI 套件仍然会跑，矩阵也一定被打印出来。
      # 这里才真正决定 verify 的成败：任一 outcome != success 就 exit 1。
      - name: Verify matrix
        if: always()
        shell: pwsh
        run: |
          $rows = [ordered]@{
            'verify/typecheck' = '${{ steps.verify_typecheck.outcome }}'
            'verify/test:unit' = '${{ steps.verify_unit.outcome }}'
            'verify/build'     = '${{ steps.verify_build.outcome }}'
          }
          $all = ($rows.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ' '
          $bad = @($rows.GetEnumerator() | Where-Object { $_.Value -ne 'success' } | ForEach-Object { $_.Key })
          Write-Host "verify result: $all"
          $all | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding UTF8
          # annotation 免 token 可读；每步只发 2 条，远低于 GitHub 每步 10 条的 error 上限。
          # 同 UI matrix：全绿发 ::notice，只有真有失败才发 ::error（否则成功的运行显示 "2 errors"）。
          $level = if ($bad.Count -gt 0) { 'error' } else { 'notice' }
          Write-Host "::$level title=Verify matrix::$all"
          if ($bad.Count -gt 0) {
            Write-Host "::error title=Failing verify steps::$($bad -join ', ')"
            exit 1
          }
          Write-Host 'all verify steps passed'
